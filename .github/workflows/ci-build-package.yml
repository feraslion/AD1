name: CI · Build & Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build web (prod)
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.dist }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/package.json','bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type check / Lint (AGENTS gate)
        run: npm run lint

      - name: Production build
        id: build
        run: |
          npm run build
          echo "dist=dist" >> $GITHUB_OUTPUT

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  package-desktop:
    name: Package desktop (Windows exe)
    runs-on: windows-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web (ensure assets present)
        run: npm run build

      - name: Build Electron (windows)
        run: |
          # This assumes you added a script "electron:build" in package.json
          npm run electron:build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }} # optional code-signing
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Collect desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            dist_electron/**/*
            build/**/*

  package-android:
    name: Package Android (APK)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web (ensure assets present for mobile wrapper)
        run: npm run build

      - name: Build Android APK
        run: |
          # This assumes you added a script "android:build" in package.json
          # The script should run the capacitor/gradle build and put APK in android/app/build/outputs/
          npm run android:build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab