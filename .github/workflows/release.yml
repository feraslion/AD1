name: AD1 ERP Automated Multi-Platform Release (EXE & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Install Electron & Builder
        run: npm install --no-save electron electron-builder

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win --x64 -c.extraMetadata.main=electron/main.js -c.win.target=nsis -c.nsis.oneClick=false -c.nsis.allowToChangeInstallationDirectory=true -c.productName="AD1-ERP" -c.directories.output="dist-electron"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Windows-Setup
          path: dist-electron/*.exe

  build-android-apk:
    name: Build Android Application (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Capacitor
        run: |
          npm ci || npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init "AD1 ERP" "com.feraslion.ad1.erp" --web-dir dist
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AD1-ERP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Android-APK
          path: dist/AD1-ERP.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AD1-ERP-Windows-Setup
          path: release-assets/windows

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: AD1-ERP-Android-APK
          path: release-assets/android

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.exe
            release-assets/android/AD1-ERP.apk
          name: AD1 ERP Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
