name: AD1 ERP Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Type Check, Lint & Automated ERP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Linter & Type Check
        run: npm run lint

      - name: Run ERP Core Engine Automated Tests
        run: npm run test

      - name: Build Web Application
        run: npm run build
