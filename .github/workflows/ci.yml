name: AD1 ERP Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Type Check, Lint & Automated ERP Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ad1_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SQL_HOST: localhost
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: postgrespassword
      SQL_DB_NAME: ad1_erp_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run TypeScript Linter & Type Check
        run: bun run lint

      - name: Run ERP Core Engine Automated Tests
        run: bun run test

      - name: Build Web Application
        run: bun run build:web

