name: AD1 ERP Automated Multi-Platform Release (EXE & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web Bundle
        run: bun run build:web

      - name: Build Windows Installer (.exe)
        run: bunx electron-builder --win --x64 -c.extraMetadata.main=electron/main.js -c.win.target=nsis -c.nsis.oneClick=false -c.nsis.allowToChangeInstallationDirectory=true -c.productName="AD1-ERP" -c.directories.output="release/windows"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Windows-Setup
          path: release/windows/*.exe

  build-android-apk:
    name: Build Android Application (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: bun install

      - name: Build Web Assets
        run: bun run build:web

      - name: Initialize & Sync Capacitor Android Project
        run: |
          bunx cap init "AD1 ERP" "com.feraslion.ad1" --web-dir dist
          bunx cap add android || true
          bunx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Release APK
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk release/android/AD1-ERP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Android-APK
          path: release/android/AD1-ERP.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AD1-ERP-Windows-Setup
          path: release-assets/windows

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: AD1-ERP-Android-APK
          path: release-assets/android

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.exe
            release-assets/android/AD1-ERP.apk
          name: AD1 ERP Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
