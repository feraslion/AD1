name: AD1 ERP Production Multi-Platform Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-web:
    name: Build Web Application & Run ERP Engine Audits
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ad1_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SQL_HOST: localhost
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: postgrespassword
      SQL_DB_NAME: ad1_erp_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install

      - name: Type Check & Code Standard Linting
        run: bun run lint

      - name: Execute Automated ERP Integration Test Suite
        run: bun run test

      - name: Build Web Application Bundle
        run: bun run build:web

  build-windows-installer:
    name: Build Windows Desktop Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install

      - name: Build Web Production Assets
        run: bun run build:web

      - name: Package Windows EXE Installer
        run: bunx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Windows-Setup
          path: release/windows/*.exe

  build-android-apk-bundle:
    name: Build Android Application (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: bun install

      - name: Build Web Production Assets
        run: bun run build:web

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            bunx cap init "AD1 ERP" "com.feraslion.ad1" --web-dir dist
            bunx cap add android
          fi
          bunx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Prepare APK Release Artifact Directory
        run: |
          mkdir -p release/android
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/AD1-ERP.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release/android/AD1-ERP.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release/android/AD1-ERP.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Android-APK
          path: release/android/AD1-ERP.apk
