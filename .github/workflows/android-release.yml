name: Android Production Release Pipeline (APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign-android:
    name: Build & Sign Production Android APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci

      - name: Inject Production Environment Variables
        run: |
          touch .env
          echo "NODE_ENV=production" >> .env
          if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
            echo "${{ secrets.PROD_ENV_FILE }}" >> .env
          fi

      - name: Build Production Web Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Sign Android Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign Android Release AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare Production Signed Release Artifacts
        run: |
          mkdir -p release/android
          if [ -f "${{ steps.sign_app_apk.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app_apk.outputs.signedReleaseFile }}" release/android/AD1-ERP-release-signed.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-signed.apk release/android/AD1-ERP-release-signed.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release/android/AD1-ERP-release-signed.apk
          fi

          if [ -f "${{ steps.sign_app_aab.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app_aab.outputs.signedReleaseFile }}" release/android/AD1-ERP-release-signed.aab
          elif [ -f "android/app/build/outputs/bundle/release/app-release-signed.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release-signed.aab release/android/AD1-ERP-release-signed.aab
          elif [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release/android/AD1-ERP-release-signed.aab
          fi

      - name: Upload Production Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Android-Release-APK
          path: release/android/*.apk

      - name: Upload Production Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Android-Release-AAB
          path: release/android/*.aab
