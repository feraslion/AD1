name: Lightweight CI + Test/Benchmark Harness
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  harness-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Execute Harness (Lint + Build + Test + Bench)
        run: bun run ci:pipeline
