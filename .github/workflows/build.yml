name: AD1 ERP Production Multi-Platform Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-web:
    name: Build Web Application & Run ERP Engine Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Type Check & Code Standard Linting
        run: npm run lint

      - name: Execute Automated ERP Integration Test Suite
        run: npm run test

      - name: Build Web Application Bundle
        run: npm run build:web

  build-windows-installer:
    name: Build Windows Desktop Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build:web

      - name: Install Electron Builder
        run: npm install --no-save electron electron-builder

      - name: Package Windows EXE Installer
        run: npx electron-builder --win --x64 -c.extraMetadata.main=electron/main.js -c.productName="AD1-ERP" -c.directories.output="release/windows"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Windows-Setup
          path: release/windows/*.exe

  build-android-apk-bundle:
    name: Build Android Application (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Capacitor Runtime
        run: |
          npm ci || npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Production Assets
        run: npm run build:web

      - name: Sync Capacitor Android Project
        run: |
          npx cap init "AD1 ERP" "com.feraslion.ad1" --web-dir dist
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Release Artifact Directory
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk release/android/AD1.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD1-ERP-Android-APK
          path: release/android/AD1.apk
